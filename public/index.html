<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLASS FEEDBACK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>CLASS FEEDBACK</h1>
  <button id="loginBtn" class="ghost">관리자 로그인</button>
</header>

<main id="studentView">
  <h2>오늘 수업은 어땠나요?</h2>
  <div class="votes">
    <button class="vote" data-rating="satisfied"><span>😊</span>만족</button>
    <button class="vote" data-rating="neutral"><span>😐</span>보통</button>
    <button class="vote" data-rating="dissatisfied"><span>😞</span>불만족</button>
  </div>
  <p id="studentMsg" class="msg"></p>
</main>

<main id="loginView" hidden>
  <form id="loginForm" class="card">
    <h2>관리자 로그인</h2>
    <input id="email" type="email" placeholder="이메일" required autocomplete="username">
    <input id="password" type="password" placeholder="비밀번호" required autocomplete="current-password">
    <button type="submit" class="primary">로그인</button>
    <button type="button" id="cancelLogin" class="ghost">취소</button>
    <p id="loginMsg" class="msg error"></p>
  </form>
</main>

<main id="adminView" hidden>
  <div class="card">
    <h2>수업 만족도 결과</h2>
    <p class="total">전체 투표 수 <strong id="total">0</strong></p>
    <div id="bars"></div>
    <div class="actions">
      <button id="refreshBtn" class="primary">새로고침</button>
      <button id="resetBtn" class="danger">투표 결과 초기화</button>
      <button id="logoutBtn" class="ghost">로그아웃</button>
    </div>
    <p id="adminMsg" class="msg error"></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
